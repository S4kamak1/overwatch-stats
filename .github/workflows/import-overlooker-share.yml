name: Import OverLooker Share

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "import_overlooker_share.py"
      - ".github/workflows/import-overlooker-share.yml"

permissions:
  contents: write

concurrency:
  group: overlooker-share-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import public OverLooker match
        run: python import_overlooker_share.py

      - name: Commit normalized match
        run: |
          git config user.name "ow-overlooker-import"
          git config user.email "ow-overlooker-import@users.noreply.github.com"
          git add data/matches/
          if git diff --cached --quiet; then
            echo "No match changes"
            exit 0
          fi
          git commit -m "Import OverLooker match"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
