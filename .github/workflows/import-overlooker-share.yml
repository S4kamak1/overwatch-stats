name: Import OverLooker Share

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "OverLooker public match UUID"
        required: false
        default: "52b337bf-c871-48d9-b8c6-67c035826ebf"
  push:
    branches:
      - main
    paths:
      - "import_overlooker_share.py"
      - "analyze_live_matches.py"
      - ".github/workflows/import-overlooker-share.yml"

permissions:
  contents: write

concurrency:
  group: overlooker-share-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import public OverLooker match
        env:
          MATCH_ID: ${{ github.event.inputs.match_id || '52b337bf-c871-48d9-b8c6-67c035826ebf' }}
        run: python import_overlooker_share.py "$MATCH_ID"

      - name: Analyze normalized matches
        run: python analyze_live_matches.py

      - name: Commit match and analysis
        run: |
          git config user.name "ow-overlooker-import"
          git config user.email "ow-overlooker-import@users.noreply.github.com"
          git add data/matches/ data/analysis/live_matches.json
          if git diff --cached --quiet; then
            echo "No match or analysis changes"
            exit 0
          fi
          git commit -m "Import and analyze OverLooker match"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
