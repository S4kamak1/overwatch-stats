name: Probe OverLooker Share

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "probe_overlooker_share.py"
      - ".github/workflows/probe-overlooker-share.yml"

permissions:
  contents: write

concurrency:
  group: overlooker-share-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe public OverLooker share
        run: python probe_overlooker_share.py

      - name: Commit diagnostic
        run: |
          git config user.name "ow-share-probe"
          git config user.email "ow-share-probe@users.noreply.github.com"
          git add data/overlooker-share-probe.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
            exit 0
          fi
          git commit -m "Update OverLooker share diagnostic"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
