name: Update Overwatch Stats

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "fetch_stats.py"
      - "track_matches.py"
      - ".github/workflows/update-stats.yml"

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: overwatch-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve previous stats
        run: |
          if [ -f data/latest.json ]; then
            cp data/latest.json /tmp/ow_previous.json
          fi

      - name: Fetch Overwatch stats
        run: python fetch_stats.py

      - name: Track match deltas
        run: python track_matches.py /tmp/ow_previous.json data/latest.json

      - name: Commit updated stats
        run: |
          git config user.name "ow-stats-bot"
          git config user.email "ow-stats-bot@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Overwatch stats"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt $attempt failed; rebasing onto latest main..."
            git fetch origin main

            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "Rebase failed"
              exit 1
            fi
          done

          echo "Push failed after 3 attempts"
          exit 1
