name: Update Overwatch Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Overwatch stats
        run: python fetch_stats.py

      - name: Commit updated stats
        run: |
          git config user.name "ow-stats-bot"
          git config user.email "ow-stats-bot@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Overwatch stats"
          git push
